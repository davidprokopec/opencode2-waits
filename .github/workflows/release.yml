name: Release

# Tags publish reviewed betas. Develop publishes unique snapshots once the
# repository variable NPM_PUBLISH_ENABLED is set to true after OIDC setup.
on:
  push:
    branches: [develop]
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest

    # Publishing is gated on this environment, so npm credentials cannot be
    # exercised by a stray tag push without whatever protection rules the
    # environment carries. The name must match the Trusted Publisher config
    # on npmjs.com.
    environment: npm

    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short lived publish
      # credential, and signs the provenance attestation. No npm token is
      # stored in this repository.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # A tag is not evidence the code is good; re-run the full suite on the
      # exact commit being published rather than trusting the CI run of a
      # branch that may have moved.
      - name: Verify
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Generate development version
        if: github.ref == 'refs/heads/develop'
        run: |
          base="$(node -p "require('./package.json').version")"
          short="${GITHUB_SHA:0:7}"
          npm version "$base-dev.$GITHUB_RUN_NUMBER.$short" --no-git-tag-version

      # Refuses to publish v1.2.3 from a tree whose package.json says anything
      # else, which is the easiest release mistake to make.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the bundled version varies by
      # runner image, so pin it rather than hope.
      - name: Pin npm
        run: npm install -g npm@11.5.1

      # No NODE_AUTH_TOKEN: authentication is the OIDC exchange, and provenance
      # is generated automatically when publishing this way.
      #
      - name: Publish beta
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --tag beta

      - name: Publish development snapshot
        if: github.ref == 'refs/heads/develop'
        run: npm publish --tag dev

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
